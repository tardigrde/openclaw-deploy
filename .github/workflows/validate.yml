name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Install Ansible
        run: pip install "ansible-core>=2.21.2,<3" --quiet

      - name: Run make validate
        run: make validate

  openclaw-config:
    name: OpenClaw config schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate configs against pinned OpenClaw schema
        run: |
          VER=$(grep -oP 'ARG OPENCLAW_VERSION=\K[^ ]+' docker/Dockerfile)
          if [[ -z "$VER" ]]; then
            echo "ERROR: could not read OPENCLAW_VERSION from docker/Dockerfile" >&2
            exit 1
          fi
          for cfg in openclaw.json openclaw.example.json; do
            if [[ ! -f "$cfg" ]]; then
              echo "SKIP: $cfg not present in this repo"
              continue
            fi
            echo "Validating $cfg against openclaw@${VER} schema..."
            if ! OPENCLAW_CONFIG_PATH="$GITHUB_WORKSPACE/$cfg" npx -y "openclaw@${VER}" config validate --json \
                 | jq -e '.valid == true' > /dev/null; then
              echo "ERROR: $cfg is invalid against openclaw@${VER} schema" >&2
              OPENCLAW_CONFIG_PATH="$GITHUB_WORKSPACE/$cfg" npx -y "openclaw@${VER}" config validate --json >&2 || true
              exit 1
            fi
            echo "✓ $cfg validates against openclaw@${VER}"
          done

  terraform-test:
    name: Terraform Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Init TFLint
        working-directory: terraform/modules/hetzner-vps
        run: tflint --init

      - name: Run TFLint
        working-directory: terraform/modules/hetzner-vps
        run: tflint --recursive

      - name: Terraform Init (hetzner-vps module)
        working-directory: terraform/modules/hetzner-vps
        run: terraform init -backend=false

      - name: Run Terraform Tests (hetzner-vps)
        working-directory: terraform/modules/hetzner-vps
        run: terraform test

      - name: Terraform Init (tailscale module)
        working-directory: terraform/modules/tailscale
        run: terraform init -backend=false

      - name: Run Terraform Tests (tailscale)
        working-directory: terraform/modules/tailscale
        run: terraform test

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          output_format: cli
          soft_fail: true
